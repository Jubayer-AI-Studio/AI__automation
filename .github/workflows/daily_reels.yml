name: Daily Facebook Reels Generator

on:
  schedule:
    # Runs twice a day: 12:00 PM and 7:30 PM Bangladesh Standard Time (UTC+6)
    # 06:00 UTC = 12:00 PM BST
    # 13:30 UTC = 07:30 PM BST
    - cron: '0 6 * * *'
    - cron: '30 13 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub mobile app or web!

jobs:
  build-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Reels Automation & Deliver to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          python main.py
