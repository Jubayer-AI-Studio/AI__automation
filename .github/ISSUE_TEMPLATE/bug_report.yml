name: 🐛 Bug Report
description: File a bug report to help improve system stability
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue! Please describe the bug clearly.
  - type: input
    id: summary
    attributes:
      label: Bug Summary
      placeholder: Brief description of the unexpected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      placeholder: What did you expect to happen versus what actually happened?
    validations:
      required: true
