<title>Assunnah Works House</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:"Noto Sans Bengali","Segoe UI",Arial,sans-serif;
    background:#03160d;
    color:white;
    overflow:hidden;
}

.app{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 30%,#087a421c,transparent 45%),
        linear-gradient(135deg,#02150c,#063c24 55%,#01140b);
}

/* ================= HEADER ================= */

.header{
    height:76px;
    position:absolute;
    left:0;
    right:0;
    top:0;
    z-index:20;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 28px;

    background:
        linear-gradient(
            90deg,
            #006a38,
            #008b48,
            #006a38
        );

    border-bottom:1px solid #ffffff22;

    box-shadow:0 8px 30px #0007;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:45px;
    height:45px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#e21b2d;

    border:3px solid white;

    font-size:22px;

    box-shadow:0 0 20px #e21b2d66;
}

.brandName{
    font-size:19px;
    font-weight:900;
}

.brandSub{
    font-size:11px;
    opacity:.7;
    margin-top:2px;
}

.headerButtons{
    display:flex;
    gap:9px;
}

.headerBtn{
    width:42px;
    height:42px;

    border-radius:13px;

    background:#ffffff12;

    border:1px solid #ffffff22;

    color:white;

    cursor:pointer;

    font-size:18px;
}

/* ================= MAP AREA ================= */

.mapArea{
    position:absolute;
    left:0;
    right:0;
    top:76px;
    bottom:0;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:
        radial-gradient(
            ellipse at center,
            #0c5a351c,
            transparent 60%
        );
}

/* subtle grid */

.mapArea::before{
    content:"";

    position:absolute;
    inset:0;

    opacity:.08;

    background-image:
        linear-gradient(#ffffff 1px,transparent 1px),
        linear-gradient(90deg,#ffffff 1px,transparent 1px);

    background-size:55px 55px;

    pointer-events:none;
}

/* ================= MAP ================= */

.map{
    width:min(900px,88vw);
    height:min(620px,70vh);

    position:relative;

    transition:
        transform .7s cubic-bezier(.2,.8,.2,1),
        opacity .4s;
}

.map.enter{
    animation:mapEnter .65s ease;
}

@keyframes mapEnter{

    0%{
        transform:scale(.75);
        opacity:0;
    }

    60%{
        transform:scale(1.03);
    }

    100%{
        transform:scale(1);
        opacity:1;
    }

}

/* ================= SVG ================= */

svg{
    width:100%;
    height:100%;
    overflow:visible;
}

.region{
    fill:#078b48;
    stroke:#bff5d6;
    stroke-width:1.5;

    cursor:pointer;

    transition:
        fill .25s,
        filter .25s,
        transform .25s;
}

.region:hover{
    fill:#e31d32;

    filter:
        drop-shadow(0 0 12px #e31d3266);

}

.region.active{
    fill:#e31d32;
}

.regionLabel{
    fill:white;

    font-size:16px;

    font-weight:900;

    text-anchor:middle;

    pointer-events:none;

    paint-order:stroke;

    stroke:#06351f;

    stroke-width:5px;

    stroke-linejoin:round;
}

.smallLabel{
    font-size:12px;
}

/* ================= LOCATION ================= */

.locationCard{
    position:absolute;

    left:25px;
    top:25px;

    z-index:10;

    min-width:270px;

    padding:15px 18px;

    border-radius:18px;

    background:#03291ae8;

    backdrop-filter:blur(16px);

    border:1px solid #ffffff1c;

    box-shadow:0 15px 40px #0007;
}

.locationSmall{
    font-size:10px;

    color:#9ee8bd;

    margin-bottom:4px;
}

.locationName{
    font-size:21px;
    font-weight:900;
}

.locationPath{
    font-size:11px;

    opacity:.6;

    margin-top:4px;
}

/* ================= BACK ================= */

.back{
    position:absolute;

    right:25px;
    top:25px;

    z-index:10;

    padding:12px 17px;

    background:#03291ae8;

    border:1px solid #ffffff1c;

    color:white;

    border-radius:13px;

    cursor:pointer;

    backdrop-filter:blur(15px);

    display:none;
}

.back.show{
    display:block;
}

/* ================= BOTTOM PANEL ================= */

.bottom{
    position:absolute;

    z-index:15;

    left:50%;

    transform:translateX(-50%);

    bottom:20px;

    width:min(690px,calc(100% - 30px));

    padding:18px;

    border-radius:23px;

    background:
        linear-gradient(
            135deg,
            #03291af2,
            #021d12f2
        );

    border:1px solid #ffffff1a;

    backdrop-filter:blur(18px);

    box-shadow:
        0 20px 60px #0009;
}

.bottomTitle{
    font-size:18px;

    font-weight:900;

    margin-bottom:3px;
}

.bottomText{
    font-size:12px;

    opacity:.65;

    margin-bottom:14px;
}

.buttons{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;
}

.action{
    border:0;

    padding:14px;

    border-radius:15px;

    color:white;

    font-size:14px;

    font-weight:900;

    cursor:pointer;

    transition:.2s;
}

.action:hover{
    transform:translateY(-2px);
}

.stay{
    background:#e31d32;

    box-shadow:0 8px 20px #e31d3230;
}

.inside{
    background:#078b48;

    box-shadow:0 8px 20px #078b4830;
}

/* ================= MINI INFO ================= */

.mapHint{
    position:absolute;

    top:100px;
    right:25px;

    z-index:5;

    padding:10px 13px;

    border-radius:12px;

    background:#03291ab8;

    border:1px solid #ffffff12;

    font-size:11px;

    color:#b8eaca;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    .header{
        height:65px;

        padding:0 13px;
    }

    .brandName{
        font-size:14px;
    }

    .brandSub{
        display:none;
    }

    .logo{
        width:38px;
        height:38px;
        font-size:18px;
    }

    .mapArea{
        top:65px;
    }

    .map{
        width:96vw;
        height:58vh;
    }

    .locationCard{
        left:12px;
        top:15px;

        min-width:210px;

        padding:11px 14px;
    }

    .locationName{
        font-size:17px;
    }

    .back{
        right:12px;
        top:15px;
    }

    .mapHint{
        display:none;
    }

    .bottom{
        bottom:10px;

        width:calc(100% - 18px);

        padding:15px;
    }

    .buttons{
        grid-template-columns:1fr;
    }

}

/* ================= HIDE ================= */

.hidden{
    display:none;
}

</style>
</head>

/* =====================================================
   DRAW MAP
===================================================== */

function drawMap(place){

    const data=places[place];

    const map=document.getElementById("map");

    map.classList.remove("enter");

    void map.offsetWidth;

    map.classList.add("enter");


    if(data.type==="bangladesh"){

        map.innerHTML=bangladeshMap();

    }

    else if(data.type==="dhaka"){

        map.innerHTML=dhakaMap();

    }

    else if(data.type==="dhakaCity"){

        map.innerHTML=dhakaCityMap();

    }

    else if(data.type==="gulshan"){

        map.innerHTML=gulshanMap();

    }

    else{

        map.innerHTML=simpleMap(place);

    }

}


/* =====================================================
   OPEN PLACE
===================================================== */

function openPlace(id){

    if(!places[id]) return;

    history.push(current);

    current=id;

    updateInterface();

}


/* =====================================================
   UPDATE
===================================================== */

function updateInterface(){

    const data=places[current];

    document.getElementById("locationName")
        .innerText=data.name;

    document.getElementById("locationPath")
        .innerText=data.path;

    document.getElementById("bottomTitle")
        .innerText=data.name;


    if(current==="bangladesh"){

        document.getElementById("bottomText")
            .innerText=
            "বাংলাদেশের যেকোনো বিভাগ নির্বাচন করুন।";

    }

    else if(current==="dhaka"){

        document.getElementById("bottomText")
            .innerText=
            "ঢাকা বিভাগের একটি জেলা নির্বাচন করুন।";

    }

    else if(current==="dhakaCity"){

        document.getElementById("bottomText")
            .innerText=
            "ঢাকার এলাকার মধ্যে প্রবেশ করুন।";

    }

    else if(current==="gulshan"){

        document.getElementById("bottomText")
            .innerText=
            "গুলশানের নির্দিষ্ট এলাকা নির্বাচন করুন।";

    }

    else{

        document.getElementById("bottomText")
            .innerText=
            "এই এলাকাকে আপনার কাজের এলাকা হিসেবে নির্বাচন করতে পারেন।";

    }


    document
        .getElementById("backButton")
        .classList.toggle(
            "show",
            history.length>0
        );


    drawMap(current);

}


/* =====================================================
   BACK
===================================================== */

function goBack(){

    if(history.length===0) return;

    current=history.pop();

    updateInterface();

}


/* =====================================================
   GO INSIDE
===================================================== */

function goInside(){

    const next={

        bangladesh:"dhaka",

        dhaka:"dhakaCity",

        dhakaCity:"gulshan",

        gulshan:"gulshan1"

    };

    if(next[current]){

        openPlace(next[current]);

    }

    else{

        stayHere();

    }

}


/* =====================================================
   STAY
===================================================== */

function stayHere(){

    const data=places[current];

    alert(
        "📍 এলাকা নির্বাচন হয়েছে\n\n"+
        data.name+
        "\n\n"+
        "এখন এখানে কাজ খুঁজতে অথবা কাজ পোস্ট করতে পারবেন।"
    );

}


/* =====================================================

drawMap("bangladesh");
